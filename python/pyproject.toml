# SPDX-License-Identifier: Apache-2.0
#
# ZERO AMBIENT RUNTIME DEPENDENCIES. Protocol parsing uses only the standard library. Full benchmark
# replay executes the exact runtime/Wasmtime wheels and support trees already bound inside the
# supplied CoreTex release; it never downloads or resolves a package from the host environment.
#
# The dev extras are pinned to exact versions because they gate a proof: an unpinned test runner
# makes "the clean-machine replay passed" a claim about whatever pip resolved that morning.
[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coretex-validator"
version = "1.0.0"
description = "Public CoreTex validator: genesis fixed-suite admission replay."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []
keywords = ["coretex", "botcoin", "base", "validator", "replay"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/botcoinmoney/coretex-client"
Source = "https://github.com/botcoinmoney/coretex-client"

[project.scripts]
coretex-validator = "coretex_validator.cli:main"

[project.optional-dependencies]
# Test-only. Never imported by the package itself — see tests/test_clean_install.py.
dev = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["coretex_validator"]
include-package-data = false

# These are the closed inputs needed to validate an externally supplied release.  RELEASE.json
# binds the wheel; the wheel therefore cannot embed RELEASE.json or its own final artifact hash.
[tool.setuptools.package-data]
coretex_validator = [
  "COUNTER_RESOURCE_LAW.v1.json",
  "CANONICAL-SUITE.v1.json",
  "LAW.md",
  "RELEASE-CONTRACT.v1.json",
  "RIG-CONTRACT-AUTHORITY.base-mainnet.json",
  "RIG-WIRE-BINDING.v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unraised-warning surprise rather than scrolling past it.
filterwarnings = ["error::DeprecationWarning"]
