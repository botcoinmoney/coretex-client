# SPDX-License-Identifier: Apache-2.0
#
# ZERO RUNTIME DEPENDENCIES. That is the headline property of this package and it is asserted by
# `tests/test_clean_install.py`, not just declared here: keccak256, secp256k1 recovery, ABI
# encoding, canonical JSON and JSON-RPC are all implemented on the standard library. A validator
# whose verdict depends on a wheel it downloaded has a supply-chain root it did not choose, and
# for a package whose entire job is "trust nobody in the protocol" that would be self-defeating.
#
# The dev extras are pinned to exact versions because they gate a proof: an unpinned test runner
# makes "the clean-machine replay passed" a claim about whatever pip resolved that morning.
[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coretex-validator"
version = "0.5.0"
description = "Public CoreTex descriptor-v3 validator: fixed-suite (v4) admission replay."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = []
keywords = ["coretex", "botcoin", "base", "validator", "replay"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/botcoinmoney/coretex-client"
Source = "https://github.com/botcoinmoney/coretex-client"

[project.scripts]
coretex-validator = "coretex_validator.cli:main"

[project.optional-dependencies]
# Test-only. Never imported by the package itself — see tests/test_clean_install.py.
dev = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["coretex_validator"]
include-package-data = false

# The counter-resource law is DATA a validator cannot re-derive and must not be asked to supply:
# it is the resource half of the Pareto rule, and a validator that had to be handed it could be
# handed a different one. It ships inside the wheel so a clean install has it.
[tool.setuptools.package-data]
coretex_validator = [
  "COUNTER_RESOURCE_LAW.v1.json",
  "EXACT-PARENT-AUTHORITY.production.json",
  # The canonical suite is DATA the validator cannot re-derive and must not be asked to supply.
  # `eval_artifact.validate_artifact` resolves a profile's declared objective vocabulary from it,
  # so even the pure schema check of a v3 artifact needs it — a clean install with no law mirror
  # must still be able to say what a v3 artifact's vectors are supposed to cover. A verified law
  # cache SUPERSEDES this copy with the bytes from the sealed `validator` tree (see
  # `canonical_suite.install_suite_bytes`), so this is the floor, never the authority.
  "CANONICAL-SUITE.v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unraised-warning surprise rather than scrolling past it.
filterwarnings = ["error::DeprecationWarning"]
